apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-app-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/mquispe-aquaware/gitops-argocd
    targetRevision: main
    path: apps/simple-app/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: simple-app-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
