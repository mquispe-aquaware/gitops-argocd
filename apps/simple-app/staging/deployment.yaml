apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-app
  namespace: simple-app-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-app
  template:
    metadata:
      labels:
        app: simple-app
    spec:
      containers:
        - name: simple-app
          image: ghcr.io/mquispe-aquaware/simple-app:v1.0.3
          ports:
            - containerPort: 80
