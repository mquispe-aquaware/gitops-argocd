apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: local-ca
  namespace: nginx-gateway
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-ca
  namespace: nginx-gateway
spec:
  isCA: true
  commonName: local-ca
  secretName: local-ca
  issuerRef:
    name: local-ca
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: local-ca-issuer
  namespace: nginx-gateway
spec:
  ca:
    secretName: local-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-gateway
  namespace: nginx-gateway
spec:
  secretName: local-gateway-tls
  dnsNames:
    - argocd.localhost
    - kargo.localhost
    - app.localhost
  issuerRef:
    name: local-ca-issuer
    kind: Issuer
